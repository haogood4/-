  - input: {loan_amount: 500000, annual_rate: 4.2, loan_years: 20, months_paid: 24, prepayment_amount: 100000, prepayment_method: 减少月供}
    expected_output: TODO_BY_CODE  # 模糊参考值已删除；new_monthly 需按公式实现经单元测试推导后回填
